name: Field Index Check

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node --check scripts/refresh-field-index.mjs
      - run: node --check scripts/validate-field-index.mjs
      - run: node scripts/validate-field-index.mjs
