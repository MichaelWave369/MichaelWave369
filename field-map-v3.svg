<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">The Field — ecosystem map</title>
  <desc id="desc">Conceptual map connecting physical infrastructure, compute, human intent, PhiOS, memory, governance, computational collaborators, Infinite Porch, research, creative tools, playable worlds, and reality feedback.</desc>
  <defs>
