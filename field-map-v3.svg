      <stop offset="1" stop-color="#111a21"/>
    </linearGradient>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#4b6873"/>
    </marker>
  </defs>

  <rect width="1200" height="760" rx="28" fill="url(#bg2)"/>
  <rect x="1" y="1" width="1198" height="758" rx="27" fill="none" stroke="#303b45" stroke-width="2"/>

  <text x="60" y="62" fill="#8ea0ad" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" letter-spacing="4">THE FIELD // CONCEPTUAL ECOSYSTEM MAP</text>
  <text x="60" y="103" fill="#f4f7f9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="31" font-weight="700">FROM SIGNALS AND INTENT TO INSPECTABLE SYSTEMS</text>

